[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-toolkit-web"
version = "0.1.0"
description = "Web front end for OSRS Toolkit — the companion to the OSRS Toolkit RuneLite plugin."
readme = "README.md"
requires-python = ">=3.12"
# osrs-toolkit -- journal.py, ranking.py and the rest of the domain layer -- is deliberately
# not listed here. It lives in this same repository now, one directory up, so it is installed
# from the checkout rather than fetched:
#
#   pip install -e .        (from the repository root, the domain layer)
#   pip install -e web      (this app)
#
# It used to be a git dependency pinned to a commit, from back when the two were separate
# repositories. That pin had to be bumped by hand every time the domain layer moved -- eleven
# times in eight weeks, several of them commits that did nothing else -- and until it was
# bumped the site ran against a domain layer older than the one the desktop app had. Neither
# is possible now: one commit changes both halves.
#
# PySide6 still never enters this environment; it is the root project's "gui" extra, and
# nothing here asks for it.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# ruff is pinned rather than floating: it is both the linter and the formatter, so a new
# release changes what `ruff format --check .` considers correct and turns a clean checkout
# red without a line of this project having changed. Raise it deliberately.
dev = ["pytest>=8.3", "ruff==0.16.3", "httpx>=0.27"]

[project.scripts]
osrs-toolkit-web = "toolkit_web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
