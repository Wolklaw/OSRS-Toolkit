[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-toolkit"
version = "1.3.1"
description = "A Windows desktop companion for Old School RuneScape market analysis and trade tracking."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# No hard runtime dependency: the desktop window is the only thing that needs PySide6, and it
# is optional below as "gui". A web server importing this package for journal.py or ranking.py
# has no business pulling in a full Qt install to get code that never touches a widget.
dependencies = []
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
# ruff is pinned rather than floating: it is both the linter and the formatter, so a new
# release changes what `ruff format --check .` considers correct and turns a clean checkout
# red without a line of this project having changed. Raise it deliberately.
dev = ["osrs-toolkit[gui]", "pytest>=8.3", "ruff==0.16.3", "nuitka>=2.5"]

[project.scripts]
osrs-toolkit = "osrs_toolkit.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
